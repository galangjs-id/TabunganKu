<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TabunganKu</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14171a">
<link rel="icon" href="icons/icon.png">
<link rel="apple-touch-icon" href="icons/icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-wallet"></i></div>
      <div>
        <div class="brand-name">TabunganKu</div>
        <div class="brand-sub">KELOLA UANGMU</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="reset-btn menu-btn" onclick="toggleMenuPopup()" title="Menu"><i class="fa-solid fa-ellipsis-vertical"></i></button>
      <div class="menu-popup" id="menuPopup">
        <button class="menu-item danger" onclick="closeMenuPopup(); openResetSheet();">
          <i class="fa-solid fa-arrow-rotate-left"></i> Reset Data
        </button>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="summary">
    <div class="card card-balance">
      <div class="card-label">Saldo saat ini</div>
      <div class="card-value num" id="balanceValue">Rp 0</div>
      <div class="card-sub" id="balanceSub">Belum ada transaksi</div>
    </div>
    <div class="card">
      <div class="card-label">Pemasukan · bulan ini</div>
      <div class="card-value income num" id="incomeValue">Rp 0</div>
    </div>
    <div class="card">
      <div class="card-label">Pengeluaran · bulan ini</div>
      <div class="card-value expense num" id="expenseValue">Rp 0</div>
    </div>
  </div>

  <div class="filter-row">
    <div class="tabs">
      <button class="tab active" data-filter="all" onclick="setFilter('all')">Semua</button>
      <button class="tab" data-filter="income" onclick="setFilter('income')">Pemasukan</button>
      <button class="tab" data-filter="expense" onclick="setFilter('expense')">Pengeluaran</button>
    </div>
    <select class="month-select" id="monthSelect" onchange="render()"></select>
  </div>

  <div class="list-section" id="listSection"></div>

</div>

<div class="bottombar">
  <div class="bottombar-inner">
    <button class="btn btn-income" onclick="openSheet('income')">
      <span class="btn-icon"><i class="fa-solid fa-arrow-down"></i></span> Pemasukan
    </button>
    <button class="btn btn-expense" onclick="openSheet('expense')">
      <span class="btn-icon"><i class="fa-solid fa-arrow-up"></i></span> Pengeluaran
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <span id="sheetTitleText">Tambah</span>
        <span class="tag" id="sheetTag"></span>
      </div>
      <button class="close-btn" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="txnForm" onsubmit="submitForm(event)">
      <div class="field">
        <label>Jumlah (Rp)</label>
        <input type="text" inputmode="numeric" id="amount" class="amount-input" placeholder="0" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Kategori</label>
          <select id="category" required></select>
        </div>
        <div class="field">
          <label>Tanggal</label>
          <input type="date" id="date" required>
        </div>
      </div>
      <div class="field">
        <label>Catatan (opsional)</label>
        <input type="text" id="note" placeholder="mis. gaji bulanan, makan siang...">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Simpan</button>
    </form>
  </div>
</div>

<div class="overlay" id="resetOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">Reset Data</div>
      <button class="close-btn" onclick="closeResetSheet()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="reset-options">
      <label class="reset-option">
        <input type="radio" name="resetScope" value="expense">
        <div class="reset-option-text"><b>Hapus pengeluaran saja</b><span>Semua transaksi pengeluaran akan dihapus</span></div>
      </label>
      <label class="reset-option">
        <input type="radio" name="resetScope" value="income">
        <div class="reset-option-text"><b>Hapus pemasukan saja</b><span>Semua transaksi pemasukan akan dihapus</span></div>
      </label>
      <label class="reset-option">
        <input type="radio" name="resetScope" value="all" checked>
        <div class="reset-option-text"><b>Hapus semua tabungan</b><span>Semua transaksi akan dihapus, saldo kembali ke 0</span></div>
      </label>
    </div>
    <button type="button" class="reset-confirm-btn" onclick="confirmReset()">Reset Sekarang</button>
  </div>
</div>

<!-- PWA Install Banner (custom, style ala NextTube) -->
<div class="pwa-banner" id="pwaBanner">
  <div class="pwa-banner-icon">
    <img src="icons/icon.png" alt="TabunganKu">
  </div>
  <div class="pwa-banner-info">
    <div class="pwa-banner-title">Install TabunganKu App</div>
    <div class="pwa-banner-sub-wrap">
      <div class="pwa-banner-sub">Cepat, ringan & offline-ready</div>
    </div>
  </div>
  <button class="pwa-banner-install" id="pwaInstallBtn">
    <i class="fa-solid fa-arrow-down-to-line"></i> Install
  </button>
</div>

<script src="app.js"></script>
</body>
</html>
