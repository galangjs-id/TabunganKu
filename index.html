<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabunganku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --bg:#ffffff;
    --surface:#f7f8fa;
    --surface-2:#f0f1f3;
    --border:#e6e8eb;
    --text:#14171a;
    --text-soft:#6b7280;
    --text-faint:#9aa1a9;
    --income:#0f9d58;
    --income-soft:#e9f9ef;
    --income-line:#bfe8cd;
    --expense:#d93025;
    --expense-soft:#fdeceb;
    --expense-line:#f3c6c2;
    --radius-sm:12px;
    --radius-md:18px;
    --radius-lg:26px;
    --radius-xl:28px;
    --shadow:0 1px 2px rgba(20,23,26,.04), 0 8px 24px rgba(20,23,26,.05);
    --shadow-card:0 1px 3px rgba(20,23,26,.05), 0 10px 20px rgba(20,23,26,.06);
    --bottombar-h:92px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  /* Top bar */
  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:920px; margin:0 auto;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(155deg, var(--income) 0%, var(--income) 49%, var(--expense) 51%, var(--expense) 100%);
    position:relative;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:14px;
    box-shadow:0 4px 10px rgba(20,23,26,.16);
  }
  .brand-name{font-weight:800; font-size:15.5px; letter-spacing:-.01em;}
  .brand-sub{font-size:11px; color:var(--text-faint); font-weight:600; letter-spacing:.02em;}

  /* Layout */
  .wrap{max-width:920px; margin:0 auto; padding:28px 20px calc(var(--bottombar-h) + 32px);}

  /* Bottom action bar */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(255,255,255,1) 60%, rgba(255,255,255,0));
    pointer-events:none;
  }
  .bottombar-inner{
    pointer-events:auto;
    width:100%; max-width:520px;
    display:flex; gap:10px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:999px;
    padding:7px;
    box-shadow:0 4px 10px rgba(20,23,26,.05), 0 16px 32px rgba(20,23,26,.10);
  }
  .btn{
    border:none; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:14.5px;
    flex:1;
    padding:14px 18px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; gap:7px;
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .btn:active{transform:scale(.95);}
  .btn-income{ background:var(--income); color:#fff; }
  .btn-income:hover{ background:#0c8a4c; }
  .btn-expense{ background:var(--expense); color:#fff; }
  .btn-expense:hover{ background:#c22820; }
  .btn-icon{
    font-size:11px; line-height:1; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.22); border-radius:999px;
  }

  /* Summary */
  .summary{
    display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:14px;
    margin-bottom:26px;
  }
  @media (max-width:640px){ .summary{grid-template-columns:1fr;} }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:20px 22px;
  }
  .card-balance{
    background:var(--text);
    border-color:var(--text);
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .card-balance::after{
    content:"";
    position:absolute; right:-30px; top:-30px;
    width:140px; height:140px; border-radius:50%;
    background:linear-gradient(135deg, rgba(15,157,88,.35), rgba(217,48,37,.35));
    filter:blur(30px);
  }
  .card-label{
    font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-faint);
    margin-bottom:8px;
  }
  .card-balance .card-label{ color:rgba(255,255,255,.55); }
  .card-value{font-size:26px; font-weight:700; letter-spacing:-.01em;}
  .card-balance .card-value{font-size:30px;}
  .card-value.income{color:var(--income);}
  .card-value.expense{color:var(--expense);}
  .card-sub{font-size:12px; color:var(--text-faint); margin-top:4px;}
  .card-balance .card-sub{color:rgba(255,255,255,.45);}

  /* Filters */
  .filter-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px; flex-wrap:wrap;
  }
  .tabs{
    display:flex; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:4px; gap:2px;
  }
  .tab{
    border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-weight:700; font-size:12.5px;
    padding:8px 16px; border-radius:999px; color:var(--text-soft);
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{background:#fff; color:var(--text); box-shadow:var(--shadow);}
  .month-select{
    font-family:inherit; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:999px; border:1px solid var(--border);
    background:#fff; color:var(--text); cursor:pointer;
  }

  /* Transaction list */
  .list-section{ display:flex; flex-direction:column; gap:22px; }
  .day-group{ display:flex; flex-direction:column; gap:10px; }
  .day-group-label{
    padding:0 6px; font-size:11.5px; font-weight:700;
    color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;
  }
  .txn{
    display:flex; align-items:center; gap:14px;
    padding:14px 16px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    transition:box-shadow .15s ease, transform .12s ease, border-color .15s ease;
  }
  .txn:hover{ box-shadow:var(--shadow-card); border-color:#dcdfe3; transform:translateY(-1px); }
  .txn-dot{
    width:42px; height:42px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:16px; flex-shrink:0;
  }
  .txn-dot.income{background:var(--income-soft); color:var(--income);}
  .txn-dot.expense{background:var(--expense-soft); color:var(--expense);}
  .txn-info{flex:1; min-width:0;}
  .txn-cat{font-weight:700; font-size:14px;}
  .txn-note{font-size:12.5px; color:var(--text-faint); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .txn-right{text-align:right; display:flex; align-items:center; gap:6px;}
  .txn-amount{font-weight:700; font-size:14.5px;}
  .txn-amount.income{color:var(--income);}
  .txn-amount.expense{color:var(--expense);}
  .txn-del{
    border:none; background:transparent; cursor:pointer;
    color:var(--text-faint); font-size:15px; padding:6px 8px;
    border-radius:999px; opacity:0; transition:opacity .12s ease, background .12s ease, color .12s ease;
  }
  .txn:hover .txn-del{opacity:1;}
  .txn-del:hover{background:#fff; color:var(--expense);}

  .empty{
    padding:60px 20px; text-align:center; color:var(--text-faint);
  }
  .empty-icon{font-size:32px; margin-bottom:10px;}
  .empty-title{font-weight:700; color:var(--text); font-size:15px; margin-bottom:4px;}
  .empty-sub{font-size:13px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(20,23,26,.4);
    backdrop-filter:blur(2px);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .overlay.open{display:flex;}
  @media (min-width:640px){ .overlay{align-items:center;} }
  .sheet{
    background:#fff; width:100%; max-width:440px;
    border-radius:28px 28px 0 0;
    padding:22px 22px 26px;
    box-shadow:0 -8px 30px rgba(0,0,0,.12);
    animation:slideUp .22s ease;
  }
  @media (min-width:640px){ .sheet{border-radius:28px; margin-bottom:20px;} }
  @keyframes slideUp{ from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;} }
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .sheet-title{font-size:16px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .sheet-title .tag{
    font-size:11px; padding:3px 9px; border-radius:99px; font-weight:700;
  }
  .sheet-title .tag.income{background:var(--income-soft); color:var(--income);}
  .sheet-title .tag.expense{background:var(--expense-soft); color:var(--expense);}
  .close-btn{
    border:none; background:var(--surface); width:30px; height:30px;
    border-radius:9px; cursor:pointer; font-size:15px; color:var(--text-soft);
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; font-weight:700; color:var(--text-soft);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%; font-family:inherit; font-size:14.5px;
    padding:11px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--text); outline-offset:-1px; background:#fff;
  }
  .amount-input{font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px !important;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .submit-btn{
    width:100%; border:none; padding:14px; border-radius:12px;
    font-family:inherit; font-weight:800; font-size:14.5px; color:#fff;
    cursor:pointer; margin-top:4px;
  }

  .fab-space{height:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-wallet"></i></div>
      <div>
        <div class="brand-name">TabunganKu</div>
        <div class="brand-sub">KELOLA UANGMU</div>
      </div>
    </div>
  </div>
</div>

<div class="wrap">

  <div class="summary">
    <div class="card card-balance">
      <div class="card-label">Saldo saat ini</div>
      <div class="card-value num" id="balanceValue">Rp 0</div>
      <div class="card-sub" id="balanceSub">Belum ada transaksi</div>
    </div>
    <div class="card">
      <div class="card-label">Pemasukan · bulan ini</div>
      <div class="card-value income num" id="incomeValue">Rp 0</div>
    </div>
    <div class="card">
      <div class="card-label">Pengeluaran · bulan ini</div>
      <div class="card-value expense num" id="expenseValue">Rp 0</div>
    </div>
  </div>

  <div class="filter-row">
    <div class="tabs">
      <button class="tab active" data-filter="all" onclick="setFilter('all')">Semua</button>
      <button class="tab" data-filter="income" onclick="setFilter('income')">Pemasukan</button>
      <button class="tab" data-filter="expense" onclick="setFilter('expense')">Pengeluaran</button>
    </div>
    <select class="month-select" id="monthSelect" onchange="render()"></select>
  </div>

  <div class="list-section" id="listSection"></div>

</div>

<div class="bottombar">
  <div class="bottombar-inner">
    <button class="btn btn-income" onclick="openSheet('income')">
      <span class="btn-icon"><i class="fa-solid fa-arrow-down"></i></span> Pemasukan
    </button>
    <button class="btn btn-expense" onclick="openSheet('expense')">
      <span class="btn-icon"><i class="fa-solid fa-arrow-up"></i></span> Pengeluaran
    </button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">
        <span id="sheetTitleText">Tambah</span>
        <span class="tag" id="sheetTag"></span>
      </div>
      <button class="close-btn" onclick="closeSheet()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="txnForm" onsubmit="submitForm(event)">
      <div class="field">
        <label>Jumlah (Rp)</label>
        <input type="number" id="amount" class="amount-input" placeholder="0" min="0" step="1" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Kategori</label>
          <select id="category" required></select>
        </div>
        <div class="field">
          <label>Tanggal</label>
          <input type="date" id="date" required>
        </div>
      </div>
      <div class="field">
        <label>Catatan (opsional)</label>
        <input type="text" id="note" placeholder="mis. gaji bulanan, makan siang...">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Simpan</button>
    </form>
  </div>
</div>

<script>
const STORAGE_KEY = 'catatan_kas_txns_v1';
const CATEGORIES = {
  income: ['Gaji','Bonus','Usaha','Hadiah','Investasi','Lainnya'],
  expense: ['Makan','Transport','Belanja','Tagihan','Hiburan','Kesehatan','Lainnya']
};
const CATEGORY_ICONS = {
  'Gaji':'fa-money-bill-wave', 'Bonus':'fa-gift', 'Usaha':'fa-briefcase',
  'Hadiah':'fa-gift', 'Investasi':'fa-chart-line',
  'Makan':'fa-utensils', 'Transport':'fa-car', 'Belanja':'fa-bag-shopping',
  'Tagihan':'fa-file-invoice-dollar', 'Hiburan':'fa-film', 'Kesehatan':'fa-heart-pulse',
  'Lainnya':'fa-ellipsis'
};
function catIcon(cat){ return CATEGORY_ICONS[cat] || 'fa-ellipsis'; }

let txns = [];
let currentType = 'income';
let currentFilter = 'all';

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    txns = raw ? JSON.parse(raw) : [];
  }catch(e){ txns = []; }
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(txns));
}

function formatRupiah(n){
  const sign = n < 0 ? '-' : '';
  return sign + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');
}

function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function openSheet(type){
  currentType = type;
  document.getElementById('sheetTitleText').textContent = type === 'income' ? 'Tambah Pemasukan' : 'Tambah Pengeluaran';
  const tag = document.getElementById('sheetTag');
  tag.textContent = type === 'income' ? 'Masuk' : 'Keluar';
  tag.className = 'tag ' + type;

  const catSelect = document.getElementById('category');
  catSelect.innerHTML = CATEGORIES[type].map(c => `<option value="${c}">${c}</option>`).join('');

  document.getElementById('date').value = todayISO();
  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';

  const submitBtn = document.getElementById('submitBtn');
  submitBtn.style.background = type === 'income' ? 'var(--income)' : 'var(--expense)';

  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('amount').focus(), 50);
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('open');
}
document.getElementById('overlay').addEventListener('click', (e) => {
  if(e.target.id === 'overlay') closeSheet();
});

function submitForm(e){
  e.preventDefault();
  const amount = parseFloat(document.getElementById('amount').value);
  if(!amount || amount <= 0) return;
  const category = document.getElementById('category').value;
  const date = document.getElementById('date').value;
  const note = document.getElementById('note').value.trim();

  txns.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    type: currentType,
    amount, category, date, note
  });
  save();
  closeSheet();
  populateMonths();
  render();
}

function deleteTxn(id){
  txns = txns.filter(t => t.id !== id);
  save();
  render();
}

function setFilter(f){
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.filter === f));
  render();
}

function populateMonths(){
  const select = document.getElementById('monthSelect');
  const prevVal = select.value;
  const months = new Set();
  txns.forEach(t => months.add(t.date.slice(0,7)));
  months.add(todayISO().slice(0,7));
  const sorted = Array.from(months).sort().reverse();
  select.innerHTML = '<option value="all">Semua waktu</option>' + sorted.map(m => {
    const [y, mo] = m.split('-');
    const label = new Date(y, mo-1, 1).toLocaleDateString('id-ID', {month:'long', year:'numeric'});
    return `<option value="${m}">${label}</option>`;
  }).join('');
  select.value = prevVal && (prevVal === 'all' || sorted.includes(prevVal)) ? prevVal : sorted[0];
}

function render(){
  const monthFilter = document.getElementById('monthSelect').value;

  const filtered = txns.filter(t => {
    if(monthFilter !== 'all' && t.date.slice(0,7) !== monthFilter) return false;
    if(currentFilter !== 'all' && t.type !== currentFilter) return false;
    return true;
  }).sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  // Summary always based on selected month (or current month if "all")
  const summaryMonth = monthFilter === 'all' ? todayISO().slice(0,7) : monthFilter;
  const monthTxns = txns.filter(t => t.date.slice(0,7) === summaryMonth);
  const monthIncome = monthTxns.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
  const monthExpense = monthTxns.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
  const totalBalance = txns.reduce((s,t) => s + (t.type === 'income' ? t.amount : -t.amount), 0);

  document.getElementById('balanceValue').textContent = formatRupiah(totalBalance);
  document.getElementById('balanceSub').textContent = txns.length + ' transaksi tercatat';
  document.getElementById('incomeValue').textContent = formatRupiah(monthIncome);
  document.getElementById('expenseValue').textContent = formatRupiah(monthExpense);

  const listSection = document.getElementById('listSection');
  if(filtered.length === 0){
    listSection.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i class="fa-regular fa-folder-open"></i></div>
        <div class="empty-title">Belum ada transaksi</div>
        <div class="empty-sub">Tambah pemasukan atau pengeluaran lewat tombol di atas.</div>
      </div>`;
    return;
  }

  // group by date
  const groups = {};
  filtered.forEach(t => {
    (groups[t.date] = groups[t.date] || []).push(t);
  });

  let html = '';
  Object.keys(groups).sort().reverse().forEach(date => {
    const label = new Date(date + 'T00:00:00').toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
    html += `<div class="day-group"><div class="day-group-label">${label}</div>`;
    groups[date].forEach(t => {
      const isIncome = t.type === 'income';
      html += `
        <div class="txn">
          <div class="txn-dot ${t.type}"><i class="fa-solid ${catIcon(t.category)}"></i></div>
          <div class="txn-info">
            <div class="txn-cat">${t.category}</div>
            ${t.note ? `<div class="txn-note">${escapeHtml(t.note)}</div>` : ''}
          </div>
          <div class="txn-right">
            <div class="txn-amount ${t.type} num">${isIncome ? '+' : '-'}${formatRupiah(t.amount)}</div>
            <button class="txn-del" onclick="deleteTxn('${t.id}')" title="Hapus"><i class="fa-solid fa-trash-can"></i></button>
          </div>
        </div>`;
    });
    html += `</div>`;
  });
  listSection.innerHTML = html;
}

function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

load();
populateMonths();
render();
</script>

</body>
</html>
